[project]
name = "concerto"
version = "0.4.0"
description = "Orchestrate Claude Code agents driven by GUS work items"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sugar & Coffee", email = "josh@sugarandcoffee.co.uk" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

# Runtime also requires the Salesforce CLI (`sf`) on PATH, authenticated
# to an org aliased as `gus` (or whatever `tracker.target_org` is set to):
#   sf org login web --instance-url https://gus.my.salesforce.com --alias gus

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.urls]
Homepage = "https://github.com/omri-alon/concerto"
Repository = "https://github.com/omri-alon/concerto"

[tool.setuptools.packages.find]
include = ["concerto*"]

[project.scripts]
concerto = "concerto.main:cli"
