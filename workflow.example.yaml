# =============================================================================
# Concerto — Example State Machine Workflow (GUS edition)
# =============================================================================
#
# Copy this file to workflow.yaml and customise for your team.
# Concerto re-reads this file on every poll tick — changes take effect
# without restart.
#
# Prompt files live in the prompts/ directory. Each agent state references
# its prompt via the `prompt` field. A global prompt (shared preamble) is
# injected before the stage-specific prompt when set.
#
# Concerto talks to GUS (Salesforce ADM_Work__c) via the `sf` CLI, so
# authentication is whatever `sf org login` has already configured for the
# `gus` alias. No API keys in this file.
#
#   sf org login web --instance-url https://gus.my.salesforce.com --alias gus
#
# GUS status roles (mapped below under `gus_statuses`):
#   todo          → work items picked up from this status
#   active        → the "working" status for agent stages
#   awaiting_ci   → gate status while CI is running
#   review        → human review / PR review status
#   gate_approved → human approved a gate (triggers transition)
#   rework        → human requested changes (triggers rework_to)
#   terminal      → list of done/closed statuses
#
# State types:
#   agent    — Concerto dispatches Claude Code in this state
#   gate     — pauses for human review; approve → next, rework → rework_to
#   terminal — work item is finished; workspace cleaned up
#
# -----------------------------------------------------------------------------
# Multi-project mode (optional — single-project YAML below still works as-is)
# -----------------------------------------------------------------------------
#
# To monitor multiple scrum teams from one Concerto process, replace the
# top-level `tracker / workspace / hooks / prompts / states` blocks with a
# `projects:` list. Each entry has its own tracker/workspace/hooks/prompts/
# state machine. Top-level `polling`, `agent`, `claude`, `gus_statuses`, and
# `server` stay global and act as defaults each project can override.
#
#   projects:
#     - name: platform-core
#       tracker:
#         kind: gus
#         target_org: gus
#         scrum_team: "Platform Core"   # Team name, or the ADM_Scrum_Team__c Id
#       workspace:
#         root: ~/.local/share/concerto/workspaces/platform-core
#       hooks: { after_create: "git clone git@github.com:org/platform-core.git ." }
#       prompts: { global_prompt: prompts/platform-core/global.md }
#       states: { ... }
# =============================================================================

# ---------------------------------------------------------------------------
# Tracker
# ---------------------------------------------------------------------------
tracker:
  kind: gus
  target_org: gus                   # `sf` CLI org alias (from `sf org login`)
  scrum_team: "Your Scrum Team"     # Team name, or an 18-char ADM_Scrum_Team__c Id
  current_sprint_only: false        # if true, restrict to the team's active sprint
                                    # (TODAY between Sprint__r.Start_Date__c and End_Date__c)
  assignee: "me"                    # Filter to work items assigned to this user
                                    # (Assignee__r.Username). Default "me" =
                                    # running `sf` user — only your tickets,
                                    # not teammates'. "" disables the filter;
                                    # or set to a literal username.

# ---------------------------------------------------------------------------
# GUS Status__c mapping
# ---------------------------------------------------------------------------
# Maps Concerto's internal lifecycle roles to your GUS Status__c picklist
# values. All six roles are required — removing or reordering them breaks
# the dispatch and gate protocol. Terminal is a list of statuses that stop
# any running agent and clean the workspace.
gus_statuses:
  todo: "New"                       # work items picked up from this status
  active: "In Progress"             # moved here automatically when agent starts
  awaiting_ci: "Integrate"          # gate status while CI is running
  review: "Ready for Review"        # agent pauses here at a gate for human review
  gate_approved: "Fixed"            # human approved — agent advances
  rework: "Triaged"                 # human requested changes — agent re-enters rework target
  terminal:
    - Closed
    - Completed
    - Duplicate
    - Rejected
    - Not a bug
    - Not Reproducible

# ---------------------------------------------------------------------------
# Polling
# ---------------------------------------------------------------------------
polling:
  interval_ms: 30000                # 30 seconds between ticks

# ---------------------------------------------------------------------------
# Workspace
# ---------------------------------------------------------------------------
workspace:
  root: ~/code/concerto-workspaces

# ---------------------------------------------------------------------------
# Hooks — shell scripts run in the workspace directory
# ---------------------------------------------------------------------------
hooks:
  after_create: |
    git clone --depth 1 git@github.com:your-org/your-repo.git .
  before_run: |
    git fetch origin main
    git rebase origin/main 2>/dev/null || git rebase --abort
  timeout_ms: 120000

# ---------------------------------------------------------------------------
# Claude defaults (inherited by all agent states unless overridden)
# ---------------------------------------------------------------------------
claude:
  permission_mode: auto
  model: claude-sonnet-4-6
  max_turns: 20
  turn_timeout_ms: 3600000          # 1 hour per turn
  stall_timeout_ms: 300000          # 5 minutes with no output → kill

# ---------------------------------------------------------------------------
# Agent concurrency
# ---------------------------------------------------------------------------
agent:
  max_concurrent_agents: 4
  max_retry_backoff_ms: 300000
  max_concurrent_agents_by_state:
    investigate: 2
    implement: 2
    code-review: 1

# ---------------------------------------------------------------------------
# Prompts
# ---------------------------------------------------------------------------
prompts:
  global_prompt: prompts/global.example.md

# ---------------------------------------------------------------------------
# Server (optional web dashboard)
# ---------------------------------------------------------------------------
server:
  port: 4200

# ---------------------------------------------------------------------------
# State machine
# ---------------------------------------------------------------------------
#
# Order matters: the first agent state is the entry state for new work items.
#
# Transitions fire automatically on agent success or human action:
#   - Agent finishes successfully  → "complete" transition
#   - Human approves a gate        → "approve" transition
#   - Human requests rework        → rework_to target
#
states:

  # ── 1. Investigate ──────────────────────────────────────────────────────
  investigate:
    type: agent
    prompt: prompts/investigate.example.md
    gus_status: active
    model: claude-opus-4-6
    max_turns: 8
    session: inherit
    transitions:
      complete: research-review

  # ── 2. Research Review (gate) ───────────────────────────────────────────
  research-review:
    type: gate
    gus_status: review
    rework_to: investigate
    max_rework: 3
    transitions:
      approve: implement

  # ── 3. Implement ────────────────────────────────────────────────────────
  implement:
    type: agent
    prompt: prompts/implement.example.md
    gus_status: active
    model: claude-sonnet-4-6
    max_turns: 30
    session: inherit
    transitions:
      complete: implementation-review

  # ── 4. Implementation Review (gate) ─────────────────────────────────────
  implementation-review:
    type: gate
    gus_status: review
    rework_to: implement
    max_rework: 5
    transitions:
      approve: code-review

  # ── 5. Code Review ─────────────────────────────────────────────────────
  code-review:
    type: agent
    prompt: prompts/review.example.md
    gus_status: active
    runner: claude
    model: claude-opus-4-6
    max_turns: 10
    session: fresh
    transitions:
      complete: merge-review

  # ── 6. Merge Review (gate) ──────────────────────────────────────────────
  merge-review:
    type: gate
    gus_status: review
    rework_to: implement
    max_rework: 5
    transitions:
      approve: merge

  # ── 7. Merge ────────────────────────────────────────────────────────────
  merge:
    type: agent
    prompt: prompts/merge.example.md
    gus_status: active
    max_turns: 5
    session: inherit
    transitions:
      complete: done

  # ── 8. Done (terminal) ─────────────────────────────────────────────────
  done:
    type: terminal
    gus_status: terminal
